# Nixpacks configuration for Railway deployment
# This ensures system dependencies are installed for OCR functionality

[phases.setup]
# Install system dependencies required for OCR and PDF processing
# poppler_utils provides pdftoppm for PDF to image conversion
# tesseract provides OCR capabilities
# cairo, pango, and other libs needed for canvas (optional dependency)
# dejavu_fonts provides Unicode font support to prevent □□□ characters
nixPkgs = ["poppler_utils", "tesseract", "ghostscript", "cairo", "pango", "pkg-config", "pixman", "giflib", "libjpeg", "librsvg", "python3", "dejavu_fonts", "liberation_ttf"]

[phases.setup.nixOverlays]
# Ensure poppler binaries are in PATH
nixpkgsArchive = "nixpkgs-unstable"

[phases.install]
# Verify poppler installation and install Node.js dependencies
# Use npm ci for deterministic installs and skip scripts (husky prepare)
cmds = [
  "echo 'Current PATH:'",
  "echo $PATH",
  "echo 'Checking for pdftoppm...'",
  "which pdftoppm || find /nix/store -name pdftoppm 2>/dev/null | head -n 1",
  "pdftoppm -v || echo 'WARNING: pdftoppm not executable'",
  "ls -la /nix/var/nix/profiles/default/bin/ || echo 'No default profile bin'",
  "npm ci --ignore-scripts || npm install --ignore-scripts"
]

[phases.build]
# Build TypeScript
cmds = ["npm run build"]

[start]
# Start the application
# Ensure Nix store binaries are in PATH at runtime
cmd = "npm start"

[variables]
# Add common Nix binary paths to ensure poppler tools are found at runtime
PATH = "/root/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$PATH"
